[project]
name = "curling-score"
version = "0.1.0"
description = "Turn a Seattle Curling Club YouTube VOD into a shot-by-shot game timeline with house state and score."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "av>=13",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# The YOLO detector. Kept out of the base install so the API image and the
# classical-detector path stay small; the worker image installs it.
gpu = ["torch>=2.4", "ultralytics>=8.3"]
# The hosted service: API, Firestore, blob storage.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    # ID-token verification only; see service/auth.py for why not google-auth.
    "firebase-admin>=6.5",
]
# The processing worker only needs to talk HTTP to the API.
worker = ["httpx>=0.27"]

[project.scripts]
curling-score = "curling_score.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The card-digit classifier's weights. Numpy reads them, so they belong in the
# base install: `analyze` reads the scoreboard without the `gpu` extra.
"curling_score.game" = ["*.npz"]
"curling_score.viewer" = ["*.html", "*.js", "*.css"]
"curling_score.service" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
# Test the checkout you are standing in. The package is installed editable
# against one working tree, so in a git worktree every `import curling_score`
# would otherwise reach back to the original -- tests would pass while
# exercising the wrong source, and a module added in the worktree would not
# import at all.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# Already quiet. Do NOT add another -q on the command line: pytest sums them,
# and -qq drops the "N passed, M failed" summary line entirely -- the run still
# reports its real exit status, but the counts vanish. Three separate sessions
# have read that silence as lost output and gone looking for a flush bug.
markers = [
    "slow: touches the full cached VOD; deselect with -m 'not slow'",
]
