[project]
name = "curling-score"
version = "0.1.0"
description = "Turn a Seattle Curling Club YouTube VOD into a shot-by-shot game timeline with house state and score."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "av>=13",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
curling-score = "curling_score.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"curling_score.viewer" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: touches the full cached VOD; deselect with -m 'not slow'",
]
