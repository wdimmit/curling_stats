# DFW Curling Club's site, dfwcurling.dimmit.net, in its own project (SITE=dfw,
# service/site.py): public, no accounts, read-only, every rock's clip cut. Deploy:
#   PROJECT_ID=<dfw project> SERVICE_YAML=deploy/dfw/cloudrun.yaml ACCOUNTS=off \
#     PUBLIC_BASE_URL=https://dfwcurling.dimmit.net MODEL_ID=dfw1a-584c18d0 \
#     DISCOVER_RANGES=2026-11-06/2026-11-09 ./deploy/deploy-api.sh
# deploy-api.sh fills PROJECT_ID, REGION, the tag, MODEL_ID, the base URL and
# DISCOVER_RANGES; `services replace` is declarative, so set them every time.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: curling-chart
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"     # request-based billing
    spec:
      serviceAccountName: curling-chart@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/curling/api:latest
          resources:
            limits: { cpu: "1", memory: 512Mi }
          env:
            - { name: GCP_PROJECT,        value: PROJECT_ID }
            - { name: GCS_BUCKET,         value: curling-chart-PROJECT_ID }
            - { name: SIGNER_EMAIL,       value: curling-chart@PROJECT_ID.iam.gserviceaccount.com }
            - { name: PUBLIC_BASE_URL,    value: https://chart.example.org }
            # The site's profile: name, nav, read-only, auto clips (service/site.py).
            - { name: SITE,               value: dfw }
            # The events' dates, inclusive, in the club's time zone: only streams
            # played on them are charted. Empty: nothing is queued.
            - { name: DISCOVER_RANGES,    value: "DISCOVER_RANGES_VALUE" }
            - { name: CLUB_TZ,            value: America/Chicago }
            - { name: ALLOWED_CHANNEL_IDS, value: UCle7XmcABZIpyveRduQH10w }
            - { name: REQUIRE_APPROVAL,   value: "0" }
            - { name: PRACTICE_ENABLED,   value: "0" }
            # curling-worker:dfw's (version.model_id of dfw1a.pt); pass MODEL_ID=dfw1a-584c18d0 to deploy-api.sh.
            - { name: MODEL_ID,           value: "dfw1a-584c18d0" }
            - { name: MAX_QUEUED,         value: "10" }
            - { name: FIREBASE_PROJECT,     value: "" }
            - { name: FIREBASE_API_KEY,     value: "" }
            - { name: FIREBASE_AUTH_DOMAIN, value: "" }
            - name: WORKER_TOKEN
              valueFrom: { secretKeyRef: { name: curling-worker-token, key: latest } }
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: curling-admin-token, key: latest } }
            - name: YT_API_KEY
              valueFrom: { secretKeyRef: { name: curling-yt-api-key, key: latest } }
            - name: IP_SALT
              valueFrom: { secretKeyRef: { name: curling-ip-salt, key: latest } }
