# Cloud Run service for the API. Deploy with deploy/deploy-api.sh.
# Secrets are read from Secret Manager; everything else is plain env.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: curling-chart
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"     # request-based billing
    spec:
      serviceAccountName: curling-chart@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/curling/api:latest
          resources:
            limits: { cpu: "1", memory: 512Mi }
          env:
            - { name: GCP_PROJECT,        value: PROJECT_ID }
            - { name: GCS_BUCKET,         value: curling-chart-PROJECT_ID }
            - { name: SIGNER_EMAIL,       value: curling-chart@PROJECT_ID.iam.gserviceaccount.com }
            - { name: PUBLIC_BASE_URL,    value: https://chart.example.org }
            - { name: ALLOWED_CHANNEL_IDS, value: UC81pcWoRJbdnK77B3WS0zjg }
            - { name: REQUIRE_APPROVAL,   value: "0" }
            # Must equal the worker's model, or every claim is refused. Recompute
            # after changing Dockerfile.worker's MODEL:
            #   python -c 'from curling_score import weights, version; print(version.model_id(weights.default_path()))'
            - { name: MODEL_ID,           value: "ds11a-27fe3faa" }
            - { name: MAX_QUEUED,         value: "10" }
            # Accounts. All three are public identifiers -- the apiKey ships
            # in the source of every Firebase web app there has ever been, so
            # none of this belongs in Secret Manager; what limits its use is
            # the Authorized domains list in the Firebase Auth console.
            #
            # The project and its auth domain follow PROJECT_ID, so they live
            # here: on 2026-09-13 a deploy without them in its environment
            # substituted empty strings and switched sign-in off site-wide for
            # thirteen hours, because `gcloud run services replace` is
            # declarative and silence means removal.
            #
            # The apiKey is the exception and stays out of the repo, which is
            # what `firebase_api_key.json` is ignored for (e6dd248): public
            # identifier or not, it is one deployment's config and not source.
            # deploy-api.sh reads it from that file, or from FIREBASE_API_KEY,
            # and refuses to deploy without one unless ACCOUNTS=off says so --
            # so it can no longer go missing quietly.
            - { name: FIREBASE_PROJECT,     value: "PROJECT_ID" }
            - { name: FIREBASE_API_KEY,     value: "FB_API_KEY" }
            - { name: FIREBASE_AUTH_DOMAIN, value: "PROJECT_ID.firebaseapp.com" }
            - name: WORKER_TOKEN
              valueFrom: { secretKeyRef: { name: curling-worker-token, key: latest } }
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: curling-admin-token, key: latest } }
            - name: YT_API_KEY
              valueFrom: { secretKeyRef: { name: curling-yt-api-key, key: latest } }
            - name: IP_SALT
              valueFrom: { secretKeyRef: { name: curling-ip-salt, key: latest } }
