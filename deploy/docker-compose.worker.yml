# The home worker. Copy deploy/worker.env.example to deploy/worker.env, fill it
# in, then:  docker compose -f deploy/docker-compose.worker.yml up -d --build
services:
  worker:
    build: { context: .., dockerfile: Dockerfile.worker }
    image: curling-worker:local
    restart: unless-stopped
    env_file: worker.env
    # A hung worker is useless if it cannot be inspected: SYS_PTRACE lets
    # `py-spy dump` read the stacks from inside the container, which is the
    # only way to tell a deadlock from slow work. The default 64 MB /dev/shm
    # is also a known source of torch hangs.
    cap_add: [SYS_PTRACE]
    shm_size: 2gb
    environment:
      CURLING_SCORE_CACHE: /data/cache
      WORKER_CACHE_GB: "300"
      # Media also goes until the disk has this much free: a live night records
      # five streams at once, ~4 GB each, before any is kept in the cache.
      WORKER_MIN_FREE_GB: "40"
      YTDLP_POT_PROVIDER: http://pot:4416
      # Half of a league night's streams each, with worker2 below; a worker
      # claims live jobs greedily up to this, so 6 here would take all five.
      LIVE_MAX_STREAMS: "3"
    depends_on: [pot]
    volumes:
      # The host's designated storage, on a disk shared with everything else
      # the box keeps: 76 GB free on 2026-09-29, less than the 300 GB budget
      # above, so it is WORKER_MIN_FREE_GB that holds the cache in.
      - /data/wdd/curling-cache:/data/cache
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  # A second worker on the same GPU. The pipeline is bound by one CPU thread,
  # so two build ~1.55x the ends an hour, each ~25% slower (measured 2026-10-02).
  # It must not share the cache: a worker empties <cache>/live at start, prunes
  # media the other may be reading, and uploads every new detections/*.npz as
  # its own. It needs its own WORKER_ID too -- the API knows workers by it alone.
  worker2:
    extends: { service: worker }
    build: !reset null
    pull_policy: never
    environment:
      WORKER_ID: home-3070-2
      WORKER_CACHE_GB: "40"
    volumes:
      - /data/wdd/curling-cache-2:/data/cache
  # Mints the proof-of-origin tokens YouTube demands before it will serve a
  # video. This used to be off, on the theory that a residential IP rarely
  # needs it; "Sign in to confirm you're not a bot" on a cold request is what
  # that theory expiring looks like. Nothing is published to the host -- only
  # the worker talks to it, over the compose network.
  #
  # Pinned to the same version as the plugin in Dockerfile.worker. The two
  # speak a versioned protocol and refuse each other across a major bump, so
  # :latest here would eventually break token minting on an unrelated rebuild.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
