# The worker box: the Ryzen 9 5950X (curling@, tailnet node `curling`), since
# 2026-10-06 -- before that, the 3070 laptop. Its RTX 3080 gave way to two RTX
# 4070s on 2026-10-14, and it has run two workers, one card each, since. Copy
# deploy/worker.env.example to deploy/worker.env, fill it in, then:
#   docker compose -f deploy/docker-compose.worker.yml up -d --build
# This file is the Ryzen's: it reserves cards 0 and 1, and its workers say they
# can see the club's cameras (WORKER_CAMERAS). A stand-in on another box has a
# compose file of its own, and must never set WORKER_CAMERAS.
services:
  worker:
    build: { context: .., dockerfile: Dockerfile.worker }
    image: curling-worker:local
    restart: unless-stopped
    env_file: worker.env
    # A hung worker is useless if it cannot be inspected: SYS_PTRACE lets
    # `py-spy dump` read the stacks from inside the container, which is the
    # only way to tell a deadlock from slow work. The default 64 MB /dev/shm
    # is also a known source of torch hangs.
    cap_add: [SYS_PTRACE]
    shm_size: 2gb
    environment:
      CURLING_SCORE_CACHE: /data/cache
      WORKER_CACHE_GB: "500"
      # Kept live recordings also go, oldest first, until the disk has this much
      # free (downloads never do): a live night records five streams at once,
      # ~4 GB each, before any is kept in the cache. The disk also holds the
      # training data, under /data/curling.
      WORKER_MIN_FREE_GB: "100"
      # Live recordings are kept this many days -- three weeks of league nights,
      # for replaying what the nightly review flags and for the Clip… of a
      # shot the game page offers that long (service/gameclips.py
      # SHOT_CLIP_DAYS) -- then go, or sooner if a cache is over budget. A
      # week records ~105-120 GB (10/07-10/20), ~55-65 GB of it on each worker.
      WORKER_RECORDING_DAYS: "21"
      YTDLP_POT_PROVIDER: http://pot:4416
      # A worker claims live jobs greedily up to this, so 6 here would take all
      # five of a night's streams; at 3 a five-sheet night splits 3/2. Two
      # workers give 6 slots: on Tuesday's and Thursday's back-to-back leagues
      # (10 streams) the later league's wait for the earlier games to end,
      # which must come inside that stream's first hour (the live first-hour
      # rule) or it is charted from the recording instead.
      #
      # Practice takes its slots from the same pool. Five sessions, one a
      # sheet, split 3/2 across the two workers, and the 6 slots hold them;
      # camera practice needs at least 5 between the two, so keep this at 3 or
      # more. Practice never overlaps a league, so the two never compete.
      LIVE_MAX_STREAMS: "3"
      # Practice sessions' streams too (from LIVE_MAX_STREAMS' slots). The
      # club only runs practice ice when no league is on, so practice never
      # shares a lane with a league night; a session does pause VOD jobs.
      # worker2 inherits it.
      WORKER_PRACTICE: "1"
      # This box can see the club's cameras (20 NDI sources, found and read
      # from the compose project's network, deploy_default, with the NDI
      # config the capture writes for itself, so no network_mode: host), and
      # the API holds camera practice jobs for workers that say so
      # (PRACTICE_SOURCE=cameras).
      # worker2 inherits it; the clips service turns it off.
      WORKER_CAMERAS: "1"
      # CUDA work (the models, and ffmpeg's NVENC) stays on card 0, numbered as
      # nvidia-smi numbers them. This does not hide card 1 from NVML: in this
      # container nvidia-smi still lists both cards. worker2 and clips reset
      # both, since they inherit worker's environment.
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      CUDA_VISIBLE_DEVICES: "0"
      # Each VOD job (and each live end) saves a few whole frames where the
      # pipeline's own checks found the detectors wrong, for a labelling
      # round: <cache>/harvest/fp/<video>/ (scripts/fp_harvest.py list).
      # Saving stops at this many GB per cache; worker2 inherits both. This
      # environment: block overrides worker.env; notes in fpframes/__init__.py.
      WORKER_FP_HARVEST: "1"
      WORKER_FP_HARVEST_GB: "20"
    depends_on: [pot]
    volumes:
      # /data is a 1.5 TB volume of its own (1.4 TB free on 2026-10-06). The
      # /data/wdd paths are the laptop's, kept so its scripts still apply.
      - /data/wdd/curling-cache:/data/cache
    # One card each for the models: this one card 0, worker2 card 1 (they are
    # loaded per worker, and one card took all three workers' before). But this
    # container holds both cards. Camera practice encodes its composite with
    # NVENC, and on this driver (610.57, open kernel module) NVENC on card 0
    # fails in a container that does not also have card 1 ("unsupported device
    # (2)", whatever NVIDIA_DRIVER_CAPABILITIES says). Card 1 alone encodes, so
    # worker2 keeps just its own. CUDA_VISIBLE_DEVICES above keeps this
    # worker's CUDA work on card 0 (results of 2026-10-24 in
    # docs/superpowers/plans/2026-10-24-practice-direct-feeds.results.md, Step 3).
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["0", "1"], capabilities: [gpu] }]
  # A second worker, on the other card. Two building at once is the box's best:
  # 65 ends an hour on 2026-10-14's benchmark (s1.ts ends 7-8, the live lane's
  # own harness), against 62 with three and 58 alone -- a third oversubscribed
  # the memory and cores. That was with the RAM at its rated speed: at the
  # JEDEC 2133 it had run at until then, the box managed ~50 at any count.
  # None may share a cache: a worker empties <cache>/live at start, prunes
  # media another may be reading, and uploads every new detections/*.npz as
  # its own. Each needs its own WORKER_ID too -- the API knows workers by it
  # alone. Each keeps its own live recordings, three weeks of up to 3 streams a
  # night: ~190 GB beside ~150 GB of downloads on 2026-10-20's figures, so 450
  # here (300 held two weeks, and the recordings are what a full cache gives up
  # first).
  worker2:
    extends: { service: worker }
    build: !reset null
    pull_policy: never
    environment:
      WORKER_ID: ryzen-3080-2
      WORKER_CACHE_GB: "450"
      # Card 1 alone, which is this container's card 0 to CUDA: worker's pin to
      # card 0 by PCI order does not apply here.
      CUDA_DEVICE_ORDER: !reset null
      CUDA_VISIBLE_DEVICES: !reset null
    volumes:
      - /data/wdd/curling-cache-2:/data/cache
    deploy: !override
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["1"], capabilities: [gpu] }]
  # worker3 (ryzen-3080-3) was retired on 2026-10-14, and its cache folded
  # into worker2's (what worker2 lacked moved in, kept recordings with their
  # markers), so worker2's pruning ages it out.
  # Cuts the clips of the rocks people say they threw (service/clipworker.py),
  # for My shots. Light: no GPU, no YouTube, four CPUs of the 5950X's sixteen,
  # so a burst of cuts never crowds the lanes above on a league night (at two,
  # a rock took ~20 s to cut, decoding 1080p60). Each worker above keeps its own
  # cache, and a game's video is in whichever ran it, so this reads both
  # -- read-only: it prunes nothing and empties nothing there -- and writes
  # only to a scratch of its own. A game whose video has left every cache gets
  # no clips; nothing is downloaded for one.
  clips:
    extends: { service: worker }
    build: !reset null
    pull_policy: never
    depends_on: !reset []
    # Named, so an image built without the clips worker fails to start rather
    # than running the pipeline with no GPU.
    command: ["python", "-m", "curling_score.service.clipworker"]
    environment:
      WORKER_ID: ryzen-clips
      WORKER_ROLE: clips
      WORKER_LIVE: "0"
      WORKER_PRACTICE: "0"
      # It claims clip jobs only, never practice, so never a camera job.
      WORKER_CAMERAS: "0"
      # It has no card, so no CUDA pin either.
      CUDA_DEVICE_ORDER: !reset null
      CUDA_VISIBLE_DEVICES: !reset null
      # It runs no pipeline, so it has no frames to save.
      WORKER_FP_HARVEST: "0"
      WORKER_CLIP_SOURCES: /data/src1:/data/src2
    volumes:
      - /data/wdd/curling-clips:/data/cache
      - /data/wdd/curling-cache:/data/src1:ro
      - /data/wdd/curling-cache-2:/data/src2:ro
    cpus: "4.0"
    deploy: !reset null
  # Mints the proof-of-origin tokens YouTube demands before it will serve a
  # video. This used to be off, on the theory that a residential IP rarely
  # needs it; "Sign in to confirm you're not a bot" on a cold request is what
  # that theory expiring looks like. Nothing is published to the host -- only
  # the worker talks to it, over the compose network.
  #
  # Pinned to the same version as the plugin in Dockerfile.worker. The two
  # speak a versioned protocol and refuse each other across a major bump, so
  # :latest here would eventually break token minting on an unrelated rebuild.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
