<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curling Chart</title>
<link rel="stylesheet" href="style.css">

<header>
  <h1>Curling Chart</h1>
  <span class="muted" id="src"></span>
  <select id="game" aria-label="Game"></select>
  <select id="end" aria-label="End"></select>
  <span class="grow"></span>
  <button id="blanks" class="pill" title="Jump to the next shot needing charting"></button>
  <button id="copyLink" title="Copy this page's link">Copy link</button>
  <button id="shareLink" title="Copy a link others can view but not edit" hidden>View-only link</button>
  <span id="save" class="pill">saved</span>
  <button id="download" title="Save overrides.json to disk">&#11015;</button>
  <button id="reportBtn">Report</button>
</header>

<main>
  <!-- ---------------------------------------------------------------- play -->
  <section class="card">
    <div class="video" id="video"><div id="player"></div></div>
    <div class="row" style="margin-top:10px">
      <button id="prev" title="Previous shot (&larr;)">&larr;</button>
      <button id="next" title="Next shot (&rarr;)">&rarr;</button>
      <button id="replay" title="Replay from before the throw (v)">&#8635; Replay</button>
      <strong id="label" class="grow"></strong>
      <a id="link" target="_blank" rel="noopener">YouTube &rarr;</a>
    </div>
    <div class="row" style="margin-top:6px">
      <label class="chk"><input type="checkbox" id="autoplay" checked> play on jump</label>
      <label class="chk">lead-in
        <input type="number" id="leadin" min="0" max="60" step="1" style="width:58px">s
      </label>
    </div>
    <div id="flags"></div>
    <div class="shots" id="shots"></div>
  </section>

  <!-- --------------------------------------------------------------- house -->
  <section class="card">
    <div class="tools">
      <button class="swatchbtn red" id="pickRed" title="Place red (r)"></button>
      <button class="swatchbtn yellow" id="pickYellow" title="Place yellow (y)"></button>
      <button id="delStone" title="Delete selected stone (x)">&#9003;</button>
      <button id="markThrown" title="Mark selected as the delivered stone (d)">&#9678;</button>
      <span class="grow"></span>
      <label class="chk"><input type="checkbox" id="showTrack" checked> track</label>
      <button id="resetShot" title="Discard manual edits to this shot">Reset</button>
    </div>
    <svg id="house" viewBox="-2.6 -2.6 5.2 8.6" aria-label="House diagram"></svg>
    <div class="muted" style="font-size:12px;margin-top:6px">
      Click the ice to add a stone, drag to move, drag off the sheet to remove.
    </div>
  </section>

  <!-- --------------------------------------------------------------- chart -->
  <aside class="card">
    <h2>Shot type</h2>
    <div class="pick" id="typeGroups"></div>
    <div class="pick" id="typeList" style="margin-top:6px"></div>
    <div class="muted" id="autoType" style="font-size:12px;margin-top:6px"></div>

    <h3>Score</h3>
    <div class="pick scorebtns" id="scoreBtns"></div>

    <h3>Miss reason</h3>
    <input type="text" id="missReason" list="missList" placeholder="&mdash;">
    <datalist id="missList"></datalist>

    <h3>Note</h3>
    <textarea id="note" placeholder="&mdash;"></textarea>

    <div class="row" style="margin-top:10px">
      <button id="markCharted" class="grow">&#10004; Mark charted (Enter)</button>
    </div>

    <dl id="detail"></dl>

    <details id="queueBox">
      <summary>Needs charting (<span id="queueCount">0</span>)</summary>
      <div class="queue" id="queue"></div>
    </details>

    <details id="scoreBox">
      <summary>Scoreboard (detected &mdash; not a goal of this tool)</summary>
      <table id="score"></table>
    </details>
  </aside>
</main>

<section id="report"></section>

<script src="app.js"></script>
