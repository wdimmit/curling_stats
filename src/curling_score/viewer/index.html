<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curling Chart</title>
<link rel="stylesheet" href="style.css">

<!-- The page is built by app.js. Everything the stylesheet selects on -- the
     ids, the classes, and the body[data-*] attributes that are this layout's
     state machine -- is rendered from frontend/viewer/, not written here.

     The comment below is the injection anchor: the service replaces it with
     the window.CHART that says whether this link edits, views or reviews. It
     is a comment rather than the script tag because a tag is markup a future
     tool might legitimately reshape, and a miss here is silent in the worst
     direction -- a view-only link that boots editable. See
     curling_score.viewer.boot_page. -->
<div id="root"></div>
<!--CHART-->
<script src="app.js"></script>
