<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Until the page takes it off, the address bar holds the link's live
     oobCode: send only the origin, which a referrer-restricted API key needs,
     never the address, to anyone, the site's own request log included. -->
<meta name="referrer" content="strict-origin">
<title>Sign in — curling.dimmit.net</title>
<link rel="stylesheet" href="/static/site.css">
<!-- The condensed display face. display=swap and the system-ui fallback in
     --display mean an offline viewer renders immediately in system sans and
     never blocks on the CDN. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&amp;display=swap">
<!-- Built by site.js from frontend/site/. data-page is what selects the
     screen: the status page is served under two different URL prefixes, so
     the document has to say what it is rather than the path being read. -->
<body data-page="signin">
<div id="root"></div>
<script type="module" src="/static/site.js"></script>
