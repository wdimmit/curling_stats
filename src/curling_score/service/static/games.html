<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curling Chart</title>
<link rel="stylesheet" href="/static/site.css">
<header>
  <h1>Curling Chart</h1>
  <a href="/">Submit a link</a>
  <span style="flex:1"></span>
  <span id="who" class="muted"></span>
  <select id="league"><option value="">All leagues</option></select>
</header>
<main>
  <p class="muted">Every game we've processed. <strong>Watch</strong> steps through a game

  else seeing.</p>
  <div class="row" id="teamrow" hidden style="margin-bottom:12px"></div>
  <div id="list" class="card"><span class="muted">Loading…</span></div>
</main>
