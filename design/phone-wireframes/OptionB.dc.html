<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#f7f7f5;color:#1a1a1a;
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;}
    a{color:#2b6cb0;} a:hover{color:#1e4e7f;}
    .scr{width:390px;background:#f7f7f5;display:flex;flex-direction:column;overflow:hidden;}
    .hd{flex:0 0 48px;background:#fff;border-bottom:1px solid #e0e0dc;
        display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;}
    .ttl{font-size:13px;font-weight:650;white-space:nowrap;letter-spacing:-.01em;}
    .grow{flex:1 1 auto;}
    .mut{color:#6b6b6b;}
    .pill{padding:4px 10px;border-radius:999px;font-size:12px;
          border:1px solid #e0e0dc;white-space:nowrap;}
    .pill.bad{background:#fef3c7;color:#b45309;border-color:transparent;}
    .pill.ok{background:#dcfce7;color:#15803d;border-color:transparent;}
    .ico{flex:0 0 44px;width:44px;height:44px;border-radius:7px;border:1px solid #e0e0dc;
         background:#fff;display:grid;place-items:center;color:#1a1a1a;}
    .ico.flat{border-color:transparent;background:transparent;}
    .vid{width:390px;flex:0 0 219px;background:#000;position:relative;display:grid;place-items:center;}
    .btn{height:44px;border-radius:7px;border:1px solid #e0e0dc;background:#fff;
         display:grid;place-items:center;font-size:13px;padding:0 12px;color:#1a1a1a;}
    .btn.on{background:#2b6cb0;color:#fff;border-color:transparent;}
    .lbl{font-size:11px;font-weight:650;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em;}
    .warn{background:#fef3c7;color:#b45309;border-radius:7px;padding:9px 11px;font-size:13px;line-height:1.4;}
    .sw{width:12px;height:12px;border-radius:50%;flex:0 0 12px;}
    .chip{flex:0 0 40px;width:40px;height:40px;border-radius:7px;display:grid;place-items:center;
          font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;
          border:1px solid transparent;position:relative;}
  </style>
</helmet>
<div class="scr" style="height:844px">

  <div class="hd">
    <div class="ttl">Game 1 &middot; 3rd end</div>
    <div class="grow"></div>
    <div class="pill bad">6 to chart</div>
    <div class="ico flat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.6" fill="currentColor"
      stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle
      cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg></div>
  </div>

  <div class="vid">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
      stroke-width="1.4" opacity=".85"><circle cx="12" cy="12" r="10"/><path
      d="M9.8 7.6l7 4.4-7 4.4z" fill="#ffffff" stroke="none"/></svg>
    <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)">
      <div style="width:38%;height:3px;background:#d13438"></div>
    </div>
  </div>

  <!-- the whole end at a glance: 16 chips, scrolled horizontally -->
  <div style="flex:0 0 46px;background:#fff;border-bottom:1px solid #e0e0dc;display:flex;
    align-items:center;gap:6px;padding:0 12px;overflow:hidden">
    <div style="flex:0 0 44px;height:36px;border-radius:7px;background:#d13438;color:#fff;
      display:grid;place-items:center;font-size:12px;position:relative">1<span
      style="position:absolute;right:4px;bottom:3px;width:5px;height:5px;border-radius:50%;
      background:#15803d"></span></div>
    <div style="flex:0 0 44px;height:36px;border-radius:7px;background:#e8b400;color:#1a1a1a;
      display:grid;place-items:center;font-size:12px;position:relative">2<span
      style="position:absolute;right:4px;bottom:3px;width:5px;height:5px;border-radius:50%;
      background:#15803d"></span></div>
    <div style="flex:0 0 44px;height:36px;border-radius:7px;background:#d13438;color:#fff;
      display:grid;place-items:center;font-size:12px">3</div>
    <div style="flex:0 0 44px;height:36px;border-radius:7px;background:#fff;
      border:2px dashed #b45309;color:#b45309;display:grid;place-items:center;font-size:12px">4</div>
    <div style="flex:0 0 44px;height:36px;border-radius:7px;background:#e8b400;color:#1a1a1a;
      display:grid;place-items:center;font-size:12px;outline:3px solid #2b6cb0;
      outline-offset:1px">5</div>
    <div style="flex:0 0 44px;height:36px;border-radius:7px;background:#fff;border:1px solid
      #e0e0dc;color:#6b6b6b;display:grid;place-items:center;font-size:12px">6</div>
    <div style="flex:0 0 44px;height:36px;border-radius:7px;background:#fff;border:1px solid
      #e0e0dc;color:#6b6b6b;display:grid;place-items:center;font-size:12px">7</div>
    <div style="flex:0 0 20px;height:36px;border-radius:7px 0 0 7px;background:#fff;
      border:1px solid #e0e0dc;border-right:0"></div>
  </div>

  <!-- three peer pages, swiped or tapped -->
  <div style="flex:0 0 48px;background:#fff;border-bottom:1px solid #e0e0dc;display:flex;
    align-items:stretch;padding:0 12px">
    <div style="flex:1 1 0;display:grid;place-items:center;font-size:13px;font-weight:650;
      color:#1a1a1a;box-shadow:inset 0 -2px 0 #2b6cb0">House</div>
    <div style="flex:1 1 0;display:grid;place-items:center;font-size:13px;color:#6b6b6b">Chart</div>
    <div style="flex:1 1 0;display:grid;place-items:center;font-size:13px;color:#6b6b6b">Detail</div>
  </div>

  <div style="flex:1 1 auto;position:relative;background:#f7f7f5">
    <svg viewBox="-2.6 -2.45 5.2 5.32" width="390" height="399" style="display:block">
      <rect x="-2.375" y="-1.829" width="4.75" height="8.23" fill="#fbfbfa"/>
      <circle cx="0" cy="0" r="1.829" fill="#3f9c47"/>
      <circle cx="0" cy="0" r="1.219" fill="#fbfbfa"/>
      <circle cx="0" cy="0" r="0.61" fill="#3b4fa8"/>
      <circle cx="0" cy="0" r="0.152" fill="#fbfbfa"/>
      <line x1="0" y1="-1.829" x2="0" y2="2.87" stroke="#c9c9c4" stroke-width="0.022"/>
      <line x1="-2.375" y1="0" x2="2.375" y2="0" stroke="#c9c9c4" stroke-width="0.022"/>
      <line x1="-2.375" y1="-1.829" x2="2.375" y2="-1.829" stroke="#c9c9c4" stroke-width="0.022"/>
      <line x1="-2.375" y1="-2.45" x2="-2.375" y2="2.87" stroke="#8a8a85" stroke-width="0.03"/>
      <line x1="2.375" y1="-2.45" x2="2.375" y2="2.87" stroke="#8a8a85" stroke-width="0.03"/>
      <path d="M-1.05 2.87 C -0.95 1.4 -0.72 0.75 -0.55 0.30" fill="none" stroke="#2b6cb0"
        stroke-width="0.04" stroke-dasharray="0.13 0.1" opacity=".85"/>
      <circle cx="0.36" cy="1.67" r="0.142" fill="#e8b400" stroke="#5f5f5b" stroke-width="0.018"/>
      <circle cx="0.15" cy="-0.62" r="0.142" fill="#e8b400" stroke="#5f5f5b" stroke-width="0.018"/>
      <circle cx="0.77" cy="-1.51" r="0.142" fill="#d13438" stroke="#5f5f5b" stroke-width="0.018"/>
      <circle cx="1.10" cy="0.85" r="0.142" fill="#d13438" stroke="#5f5f5b" stroke-width="0.018"/>
      <circle cx="-1.35" cy="-0.90" r="0.142" fill="#d13438" stroke="#5f5f5b" stroke-width="0.018"/>
      <circle cx="-0.55" cy="0.30" r="0.142" fill="#e8b400" stroke="#5f5f5b" stroke-width="0.018"/>
      <circle cx="-0.55" cy="0.30" r="0.215" fill="none" stroke="#ffffff" stroke-width="0.05"/>
    </svg>
    <div style="position:absolute;top:10px;right:10px;display:flex;gap:8px">
      <div class="ico" style="box-shadow:0 1px 3px rgba(0,0,0,.16)"><svg width="20" height="20"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="3 2.5"><path d="M5 20C7 12 12 8 19 5"/></svg></div>
      <div class="ico" style="box-shadow:0 1px 3px rgba(0,0,0,.16)"><svg width="20" height="20"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path
        d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
    </div>
  </div>

  <div style="flex:0 0 84px;background:#fff;border-top:1px solid #e0e0dc;display:flex;
    align-items:flex-start;gap:8px;padding:12px 12px 0">
    <div class="btn" style="flex:0 0 56px;padding:0;height:48px"><svg width="24" height="24"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="btn" style="flex:0 0 56px;padding:0;height:48px"><svg width="22" height="22"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path
      d="M3 4.2v4.6h4.6"/></svg></div>
    <div class="btn on" style="flex:1 1 auto;height:48px;grid-auto-flow:column;gap:8px"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path
        d="M20 6.5L9.2 17.3 4 12.1"/></svg>Charted</div>
    <div class="btn" style="flex:0 0 56px;padding:0;height:48px"><svg width="24" height="24"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
