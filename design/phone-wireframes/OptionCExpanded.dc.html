<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#f7f7f5;color:#1a1a1a;
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;}
    a{color:#2b6cb0;} a:hover{color:#1e4e7f;}
    .scr{width:390px;background:#f7f7f5;display:flex;flex-direction:column;overflow:hidden;}
    .hd{flex:0 0 48px;background:#fff;border-bottom:1px solid #e0e0dc;
        display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;}
    .ttl{font-size:13px;font-weight:650;white-space:nowrap;letter-spacing:-.01em;}
    .grow{flex:1 1 auto;}
    .mut{color:#6b6b6b;}
    .pill{padding:4px 10px;border-radius:999px;font-size:12px;
          border:1px solid #e0e0dc;white-space:nowrap;}
    .pill.bad{background:#fef3c7;color:#b45309;border-color:transparent;}
    .pill.ok{background:#dcfce7;color:#15803d;border-color:transparent;}
    .ico{flex:0 0 44px;width:44px;height:44px;border-radius:7px;border:1px solid #e0e0dc;
         background:#fff;display:grid;place-items:center;color:#1a1a1a;}
    .ico.flat{border-color:transparent;background:transparent;}
    .vid{width:390px;flex:0 0 219px;background:#000;position:relative;display:grid;place-items:center;}
    .btn{height:44px;border-radius:7px;border:1px solid #e0e0dc;background:#fff;
         display:grid;place-items:center;font-size:13px;padding:0 12px;color:#1a1a1a;}
    .btn.on{background:#2b6cb0;color:#fff;border-color:transparent;}
    .lbl{font-size:11px;font-weight:650;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em;}
    .warn{background:#fef3c7;color:#b45309;border-radius:7px;padding:9px 11px;font-size:13px;line-height:1.4;}
    .sw{width:12px;height:12px;border-radius:50%;flex:0 0 12px;}
    .chip{flex:0 0 40px;width:40px;height:40px;border-radius:7px;display:grid;place-items:center;
          font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;
          border:1px solid transparent;position:relative;}
  </style>
</helmet>
<div class="scr" style="height:844px">

  <div class="hd">
    <div class="chip" style="background:#e8b400;color:#1a1a1a">5</div>
    <div class="ttl">Game 1 &middot; 3rd end</div>
    <div class="grow"></div>
    <div class="pill bad">6 to chart</div>
    <div class="ico flat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.6" fill="currentColor"
      stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle
      cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg></div>
  </div>

  <!-- the video never goes away, even at full sheet -->
  <div class="vid">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
      stroke-width="1.4" opacity=".85"><circle cx="12" cy="12" r="10"/><path
      d="M9.8 7.6l7 4.4-7 4.4z" fill="#ffffff" stroke="none"/></svg>
    <div style="position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center">
      <span style="background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 7px;
        border-radius:5px">&minus;10&thinsp;s lead-in</span>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)">
      <div style="width:38%;height:3px;background:#d13438"></div>
    </div>
  </div>

  <!-- sheet, expanded: the full chart form. Covers the house, not the video. -->
  <div style="flex:1 1 auto;background:#fff;border-top:1px solid #e0e0dc;
    border-radius:16px 16px 0 0;margin-top:-16px;position:relative;z-index:2;
    box-shadow:0 -3px 14px rgba(0,0,0,.08);padding:0 12px 24px;display:flex;
    flex-direction:column;min-height:0">

    <div style="display:flex;justify-content:center;padding:10px 0 10px">
      <div style="width:36px;height:4px;border-radius:2px;background:#e0e0dc"></div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;height:30px">
      <div class="sw" style="background:#e8b400"></div>
      <div style="font-size:15px;font-weight:650">second&rsquo;s 1st rock</div>
      <div class="grow"></div>
      <div class="ico flat"><svg width="20" height="20"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    </div>

    <div style="flex:1 1 auto;min-height:0;overflow:hidden;position:relative">
    <div style="display:flex;gap:8px;margin-top:10px">
      <div class="btn on" style="flex:1 1 0">Draw</div>
      <div class="btn" style="flex:1 1 0">Guard</div>
      <div class="btn" style="flex:1 1 0">Hit</div>
      <div class="btn" style="flex:1 1 0">Other</div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
      <div class="btn on" style="padding:0 14px">Draw</div>
      <div class="btn" style="padding:0 14px">Come around</div>
      <div class="btn" style="padding:0 14px">Freeze</div>
      <div class="btn" style="padding:0 14px">Split on</div>
      <div class="btn" style="padding:0 14px">Tap up</div>
    </div>

    <div class="lbl" style="margin-top:12px">Grade</div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <div class="btn" style="flex:1 1 0;height:48px">0</div>
      <div class="btn" style="flex:1 1 0;height:48px">1</div>
      <div class="btn" style="flex:1 1 0;height:48px">2</div>
      <div class="btn on" style="flex:1 1 0;height:48px">3</div>
      <div class="btn" style="flex:1 1 0;height:48px">4</div>
    </div>

    <div class="lbl" style="margin-top:12px">Miss reason</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
      <div class="btn on" style="padding:0 14px">light</div>
      <div class="btn" style="padding:0 14px">heavy</div>
      <div class="btn" style="padding:0 14px">narrow</div>
      <div class="btn" style="padding:0 14px">wide</div>
    </div>

    <div class="lbl" style="margin-top:12px">Note</div>
    <div style="margin-top:4px;border:1px solid #e0e0dc;border-radius:7px;height:44px;
      padding:10px 11px;color:#6b6b6b;font-size:13px">Called for four-foot, came up short</div>

    <!-- order: status at a glance, one tap to the native picker. Rare for a
         real shot, so it collapses; for a blank it is promoted to the peek. -->
    <div style="display:flex;align-items:center;gap:10px;margin-top:12px;height:44px;
      border:1px solid #e0e0dc;border-radius:7px;padding:0 12px">
      <span class="lbl" style="margin:0">Order</span>
      <span style="font-size:13px">detected order</span>
      <div class="grow"></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6b6b"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path
        d="M9 18l6-6-6-6"/></svg>
    </div>
    </div>

    <div style="display:flex;gap:8px;padding-top:12px">
      <div class="btn" style="flex:0 0 56px;padding:0;height:48px"><svg width="24" height="24"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="btn" style="flex:0 0 56px;padding:0;height:48px"><svg width="22" height="22"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path
        d="M3 4.2v4.6h4.6"/></svg></div>
      <div class="btn on" style="flex:1 1 auto;height:48px;grid-auto-flow:column;gap:8px"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path
        d="M20 6.5L9.2 17.3 4 12.1"/></svg>Charted</div>
      <div class="btn" style="flex:0 0 56px;padding:0;height:48px"><svg width="24" height="24"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
